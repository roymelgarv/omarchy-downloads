name: CI

on:
  pull_request:
  push:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests (Model.js)
        run: node --test tests/*.test.mjs

      - name: Manifest lint
        run: |
          jq -e '
            .schemaVersion == 1 and
            (.id | test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
            (.id | startswith("omarchy.") | not) and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.kinds | length > 0) and
            (.entryPoints | length > 0)
          ' manifest.json
          for f in $(jq -r '.entryPoints[]' manifest.json); do
            case "$f" in
              /*|*..*) echo "invalid entry point path: $f"; exit 1 ;;
            esac
            test -f "$f" || { echo "missing entry point: $f"; exit 1; }
          done

      - name: No symlinks in plugin tree
        run: |
          if find . -path ./.git -prune -o -type l -print | grep -q .; then
            echo "symlinks are not allowed in Omarchy plugins"; exit 1
          fi

      - name: ShellCheck
        # -x follows sourced files; -P SCRIPTDIR resolves them relative to the
        # sourcing script's own directory, which is how bin/* locate lib.sh
        # ($(dirname "${BASH_SOURCE[0]}")/lib.sh). Without both, lib.sh is
        # unresolvable and SC1091 fails the build. This lints lib.sh's contents
        # in context rather than merely silencing the warning.
        run: shellcheck -x -P SCRIPTDIR bin/* scripts/*.sh

      - name: Install bats (pinned)
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Bats tests (bin scripts)
        run: bats tests/bin.bats

      - name: QML syntax check (non-blocking)
        # Best-effort only: qmllint can't resolve the Quickshell/qs.Ui/
        # qs.Commons modules these files import (they only exist inside a
        # running omarchy-shell, not on a bare CI runner), so this can't be a
        # hard gate without vendoring those modules. It still catches plain
        # QML syntax errors, which is worth having even non-blocking.
        run: |
          sudo apt-get update -q && sudo apt-get install -qy qt6-declarative-dev
          QMLLINT="$(command -v qmllint6 || command -v qmllint || find /usr/lib/qt6 -name qmllint 2>/dev/null | head -1)"
          if [ -z "$QMLLINT" ]; then
            echo "qmllint not found, skipping"; exit 0
          fi
          "$QMLLINT" BarWidget.qml FileRow.qml Service.qml || true
